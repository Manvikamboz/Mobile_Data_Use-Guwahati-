paths:
  train: data/raw/train.csv
  later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  cleaned_train: data/processed/train_clean.csv
  model_output: models/model.joblib
  findings: reports/findings.yaml
target: gb_per_day
date_col: date
group_col: circle
text_cols:
  - phone_tier
  - circle
numeric_cols:
  - age
  - screen_hours
  - apps_installed
  - plan_gb_limit
  - video_minutes
  - wifi_hours
leak_corr_threshold: 0.95
stuck_min_run: 20

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "mp238-mobile-data-guwahati"
  registered_model_name: "mp238-gb-per-day-model"

training:
  test_size: 0.2
  random_state: 42
  models:
    dummy:
      strategy: "median"
    linear_regression: {}
    decision_tree:
      max_depth: [null, 2, 4, 6]
    random_forest:
      n_estimators: [50, 100, 200, 250]
