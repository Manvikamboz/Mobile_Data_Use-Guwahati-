apiVersion: apps/v1
kind: Deployment

metadata:
  name: mp238-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mp238-api

  template:
    metadata:
      labels:
        app: mp238-api

    spec:
      containers:
        - name: mp238-api
          image: mp238-api:1.0

          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10